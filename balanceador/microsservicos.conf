worker_processes auto;

events {
    worker_connections 8192;
}

http {
    access_log off;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;

    upstream api-gateway  { server api-gateway:8080;  keepalive 128; }
    upstream auth         { server auth:8081;         keepalive 64; }
    upstream participante { server participante:8082; keepalive 64; }
    upstream produto      { server produto:8083;      keepalive 64; }
    upstream loja         { server loja:8084;         keepalive 64; }
    upstream pedido       { server pedido:8085;       keepalive 64; }
    upstream pagamento    { server pagamento:8086;    keepalive 64; }

    server { listen 8080; location / { proxy_pass http://api-gateway; } }
    server { listen 8081; location / { proxy_pass http://auth; } }
    server { listen 8082; location / { proxy_pass http://participante; } }
    server { listen 8083; location / { proxy_pass http://produto; } }
    server { listen 8084; location / { proxy_pass http://loja; } }
    server { listen 8085; location / { proxy_pass http://pedido; } }
    server { listen 8086; location / { proxy_pass http://pagamento; } }
}
