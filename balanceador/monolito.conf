worker_processes auto;

events {
    worker_connections 8192;
}

http {
    access_log off;
    client_max_body_size 20m;

    upstream monolito {
        server monolito:8080;
        keepalive 128;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://monolito;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
        }
    }
}
